name: CI

on:
  pull_request:
    branches: [main, test/adversarial-qa-security-f1]
  push:
    branches: [main, test/adversarial-qa-security-f1]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering-safety-net:
    name: Engineering safety net
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Documentation structure check
        run: npm run docs:check

      - name: Golden FurniSpec demo (G2.1)
        run: npm run demo:golden-wardrobe

      - name: Golden PartGraph demo (G2.2)
        run: npm run demo:golden-partgraph

      - name: Parametric PartGraph demo (G2.2-R1)
        run: npm run demo:parametric-partgraph

      - name: G4 AI-Alpha wardrobe demo
        run: npm run demo:ai-wardrobe

      - name: Construction validator tests
        run: npm run test:validator

      - name: Unit tests (Vitest)
        run: npm run test:unit

      - name: Lint
        run: npm run lint
