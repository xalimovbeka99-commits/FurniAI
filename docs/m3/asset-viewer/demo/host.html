<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FurniAI · generated-model viewer · host page (DEMO, SIMULATED)</title>
<!--
  Interim HOST page (integration lead, 2026-10-07). It mounts the viewer exactly
  like the static site would: three r128 is a GLOBAL (window.THREE from the repo's
  vendor-three-r128.min.js), loader classes hang on it as THREE.GLTFLoader /
  THREE.OrbitControls, and the viewer is a classic script exposing
  window.FurniAssetViewer.mount(containerEl, { THREE, ...opts }). No modules,
  no import map, no second three. Served by serve.mjs (DEMO ONLY).
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f2efea; color: #1f1f1f; }
  .banner { margin: 0; padding: 10px 16px; background: #6b1f10; color: #fff; font-size: 14px; overflow-wrap: anywhere; }
  .banner strong { letter-spacing: .02em; }
  .banner .class { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 10px; background: #fff; color: #6b1f10; font-weight: 700; }
  h1 { font-size: 18px; margin: 12px 16px 0; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 16px; padding: 12px 16px 24px; }
  /* Container sizing the viewer expects: a block with a real width AND height (it fills 100% x 100%). */
  .viewer-slot { width: 100%; height: clamp(320px, 62vh, 620px); background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  .host-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  button, .states a { font: inherit; min-height: 44px; min-width: 44px; padding: 8px 14px; border-radius: 8px; border: 1px solid #5a4a3a; background: #fff; color: #1f1f1f; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid #0b57d0; outline-offset: 2px; }
  aside { background: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 1px 4px rgba(0,0,0,.18); min-width: 0; }
  aside h2 { font-size: 15px; margin: 2px 0 8px; }
  dl { margin: 0 0 12px; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 10px; font-size: 13px; }
  dt { font-weight: 600; } dd { margin: 0; overflow-wrap: anywhere; }
  .states { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .states a { display: inline-flex; align-items: center; text-decoration: none; font-size: 13px; padding: 6px 10px; }
  .states a[aria-current="page"] { background: #1f1f1f; color: #fff; }
  @media (max-width: 760px) {
    main { grid-template-columns: minmax(0, 1fr); padding: 10px; gap: 12px; }
    h1 { margin: 10px 10px 0; font-size: 16px; }
    .viewer-slot { height: clamp(300px, 56vh, 520px); }
  }
</style>
</head>
<body>
<header>
  <p class="banner" id="sim-banner"><strong>SIMULATED, demonstration asset, not a Scenario result</strong>
    <span class="class" id="evidence-class">Evidence: …</span></p>
  <h1>Generated-model viewer · host page</h1>
</header>
<main>
  <section aria-label="3D viewer">
    <div id="viewer" class="viewer-slot"></div>
    <div class="host-actions">
      <button type="button" id="host-replace">Replace with another model</button>
      <button type="button" id="host-navigate">Leave page (dispose viewer)</button>
    </div>
  </section>
  <aside aria-labelledby="panel-h">
    <h2 id="panel-h">Host panel</h2>
    <dl>
      <dt>State</dt><dd id="host-state">…</dd>
      <dt>Evidence</dt><dd id="host-evidence">…</dd>
      <dt>three</dt><dd id="host-three">…</dd>
      <dt>Charge</dt><dd id="host-billing">No job</dd>
    </dl>
    <nav aria-label="Demo states">
      <ul class="states" id="host-states"></ul>
    </nav>
  </aside>
</main>
<script src="/vendor-three-r128.min.js"></script>
<script src="/__demo/r128-globals.js"></script>
<script src="/__demo/asset-viewer.js"></script>
<script src="/__demo/asset-viewer-creative.js"></script>
<script src="./host.js"></script>
</body>
</html>
