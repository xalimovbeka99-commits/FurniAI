<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept gallery: SYNTHETIC/MOCKED demo (contract rev 2)</title>
  <!-- Same wiring as Asset Engineer's demo (docs/m3/asset-viewer/demo/creative.html): three from node_modules. -->
  <script type="importmap">
  { "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/addons/": "/node_modules/three/examples/jsm/"
  } }
  </script>
  <!-- Antigravity's design tokens, consumed read-only as CSS custom properties. -->
  <link rel="stylesheet" href="/src/styles/design-tokens.css">
  <style>
    body{margin:0;background:var(--paper,#FAF9F5);font-family:var(--font-sans,system-ui,sans-serif);color:var(--ink,#1C1E21)}
    .demo-banner{margin:0;background:#fffbeb;border-bottom:1px solid #fde68a;color:#7c2d12;padding:10px 16px;font-size:13px}
    .demo-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line,#DFD9CC);font-size:13px}
    .demo-bar select{font:inherit;padding:4px 6px;max-width:100%}
    .demo-wrap{padding:0 16px 24px}
    .demo-log{max-width:960px;margin:8px auto 0;font:12px/1.4 ui-monospace,monospace;color:var(--ink-soft,#5C626E);white-space:pre-wrap;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <p class="demo-banner" role="note"><strong>SYNTHETIC/MOCKED DATA.</strong> Not a real Scenario demo and not LIVE. Jobs come from Claude's SIMULATED rev 2 fixture pack (3946b53); the 3D file is a SYNTHETIC grey box, not a Scenario output. No external network and no paid calls; the reload state uses a MOCKED route on the local demo server.</p>
  <div class="demo-bar">
    <label for="state">State</label>
    <select id="state"></select>
  </div>
  <div class="demo-wrap">
    <div id="gallery"></div>
    <p class="demo-log" id="log" aria-live="polite"></p>
  </div>
  <script type="module" src="./demo.js"></script>
</body>
</html>
