<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concept gallery: FIXTURE DATA demo</title>
  <style>
    body{margin:0;background:#FAF9F5;font-family:system-ui,sans-serif;color:#1C1E21}
    .demo-banner{background:#fffbeb;border-bottom:1px solid #fde68a;color:#7c2d12;padding:10px 16px;font-size:13px}
    .demo-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid #DFD9CC;font-size:13px}
    .demo-bar select{font:inherit;padding:4px 6px}
    .demo-wrap{padding:0 16px 24px}
    .demo-log{max-width:960px;margin:8px auto 0;font:12px/1.4 ui-monospace,monospace;color:#5C626E;white-space:pre-wrap}
  </style>
</head>
<body>
  <p class="demo-banner" role="note"><strong>FIXTURE DATA.</strong> Not a real Scenario demo. Every job, date and file below is invented, shaped like SCENARIO_3D_API_CONTRACT.md (PROPOSED). No network or paid calls are made.</p>
  <div class="demo-bar">
    <label for="state">State</label>
    <select id="state"></select>
  </div>
  <div class="demo-wrap">
    <div id="gallery"></div>
    <p class="demo-log" id="log" aria-live="polite"></p>
  </div>
  <script type="module" src="./demo.js"></script>
</body>
</html>
